name: Verify credit-risk project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Rebuild from official public source
        run: python -m src.pipeline --clean
      - name: Execute narrative notebooks
        run: python -m src.notebooks
      - name: Export static explorer
        run: python -m src.web_demo
      - name: Verify tests, SQL, metrics and Streamlit
        run: python -m src.final_audit
      - name: Check presentation and exported scores
        run: python scripts/release_audit.py
